[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbom-scout"
version = "0.1.0"
description = "Cryptographic Bill of Materials (CBOM) engine — AST, certificate, and live TLS discovery with CycloneDX v1.6 export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "cbom-scout contributors" }]
keywords = ["cbom", "cyclonedx", "cryptography", "pqc", "sbom"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]

[project.scripts]
cbom-scout = "cbom_scout.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cbom_scout"]

# Supply-chain cool-off: dependency candidates must have been published at
# least 7 days before uv will resolve/select them. A freshly-published
# (potentially compromised or yanked) release is invisible to fresh locks,
# CI syncs, and upgrades until it has survived a week in public.
# Applies to resolution (uv lock / uv sync / uv add), not to installing
# from an existing uv.lock, whose pinned versions are already vetted.
[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
